name: Checks

# The same checks the git hooks run, for every pull request and every push to main,
# so a clone that never turned the hooks on still gets them.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-all.js
