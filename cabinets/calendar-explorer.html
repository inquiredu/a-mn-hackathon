<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Calendar Explorer</title>
<script>
/* ------------------------------------------------------------
   PART 1: THE KNOBS. Change these to make the Explorer yours.
   ------------------------------------------------------------ */

const TITLE = "October at a glance";

// Each calendar and its color
const CALENDARS = {
  "District": "#10345A",
  "High School": "#B8430F",
  "Middle School": "#2E7D4F",
  "Elementary": "#6A44C9",
  "Athletics": "#8A6100",
  "Board & Community": "#2C6289"
};

const BUSY_DAY = 4;   // a day with this many events or more is flagged as busy

// Made-up events. Times use a 24-hour clock ("18:00" is 6:00 PM). Leave start empty for all day.
const EVENTS = [
  { title: "Board work session", calendar: "Board & Community", date: "2026-10-12", start: "18:00", end: "20:00", place: "District Office" },
  { title: "Fall play rehearsal", calendar: "High School", date: "2026-10-12", start: "15:30", end: "17:30", place: "Auditorium" },
  { title: "Principals' PLC", calendar: "District", date: "2026-10-13", start: "08:00", end: "09:30", place: "District Office" },
  { title: "Picture day", calendar: "Elementary", date: "2026-10-13", start: "", end: "", place: "North Elementary" },
  { title: "Volleyball vs. Lakeview", calendar: "Athletics", date: "2026-10-13", start: "16:30", end: "18:00", place: "Middle School Gym" },
  { title: "Early release: staff learning", calendar: "District", date: "2026-10-14", start: "13:00", end: "15:30", place: "All buildings" },
  { title: "College and career fair", calendar: "High School", date: "2026-10-14", start: "18:00", end: "20:00", place: "High School Commons" },
  { title: "Family night", calendar: "Middle School", date: "2026-10-14", start: "18:30", end: "20:00", place: "Middle School Commons" },
  { title: "No school: fall break", calendar: "District", date: "2026-10-15", start: "", end: "", place: "All buildings" },
  { title: "No school: fall break", calendar: "District", date: "2026-10-16", start: "", end: "", place: "All buildings" },
  { title: "Budget committee", calendar: "Board & Community", date: "2026-10-19", start: "17:00", end: "18:30", place: "District Office" },
  { title: "Band concert", calendar: "High School", date: "2026-10-19", start: "19:00", end: "20:30", place: "Auditorium" },
  { title: "Conferences", calendar: "Elementary", date: "2026-10-20", start: "16:00", end: "20:00", place: "North Elementary" },
  { title: "Conferences", calendar: "Middle School", date: "2026-10-20", start: "16:00", end: "20:00", place: "Middle School" },
  { title: "Volleyball section playoff", calendar: "Athletics", date: "2026-10-20", start: "19:00", end: "21:00", place: "High School Gym" },
  { title: "Community ed open house", calendar: "Board & Community", date: "2026-10-20", start: "18:00", end: "19:30", place: "High School Gym" },
  { title: "Technology committee", calendar: "District", date: "2026-10-21", start: "15:45", end: "17:00", place: "District Office" },
  { title: "Superintendent coffee", calendar: "Board & Community", date: "2026-10-22", start: "07:30", end: "08:30", place: "Main Street Cafe" },
  { title: "Cross-country sections", calendar: "Athletics", date: "2026-10-22", start: "13:00", end: "16:00", place: "Off site" },
  { title: "Book fair", calendar: "Elementary", date: "2026-10-22", start: "15:00", end: "19:00", place: "South Elementary" },
  { title: "Conferences", calendar: "Elementary", date: "2026-10-22", start: "16:00", end: "20:00", place: "South Elementary" },
  { title: "Conferences", calendar: "High School", date: "2026-10-22", start: "16:00", end: "20:00", place: "High School" },
  { title: "Homecoming pep fest", calendar: "High School", date: "2026-10-23", start: "14:00", end: "15:00", place: "High School Gym" },
  { title: "Homecoming game", calendar: "Athletics", date: "2026-10-23", start: "19:00", end: "21:30", place: "Stadium" },
  { title: "Board meeting", calendar: "Board & Community", date: "2026-10-26", start: "18:30", end: "20:30", place: "District Office" },
  { title: "Fall concert", calendar: "Middle School", date: "2026-10-26", start: "19:00", end: "20:00", place: "Auditorium" },
  { title: "Kindergarten info night", calendar: "Elementary", date: "2026-10-27", start: "18:00", end: "19:00", place: "North Elementary" },
  { title: "Early release: PLCs", calendar: "District", date: "2026-10-28", start: "13:00", end: "15:30", place: "All buildings" },
  { title: "Fall play", calendar: "High School", date: "2026-10-29", start: "19:00", end: "21:00", place: "Auditorium" },
  { title: "Halloween parade", calendar: "Elementary", date: "2026-10-30", start: "14:00", end: "15:00", place: "South Elementary" },
  { title: "Fall play", calendar: "High School", date: "2026-10-30", start: "19:00", end: "21:00", place: "Auditorium" }
];
</script>
<style>
  /* Colors: change these to make it yours */
  :root {
    --accent: #10345A;
    --page: #F4F7FA;
    --card: #FFFFFF;
    --ink: #142033;
    --muted: #4A5A6E;
    --line: #CBD6E2;
    --edge: #6E7F94;      /* box borders */
    --flag: #9A4D00;      /* overlaps */
    --clash: #B42318;     /* same place, same time */
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 0; font-size: 1.7rem; }
  .lede { margin: 4px 0 0; color: var(--muted); }

  .controls { margin-top: 16px; padding: 16px; display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .search label { display: block; margin-bottom: 4px; font-weight: 600; }
  .search input { width: 100%; padding: 8px 12px; font: inherit; border: 2px solid var(--edge); border-radius: 10px; }
  fieldset { margin: 0; padding: 0; border: 0; }
  legend { margin-bottom: 6px; padding: 0; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .filters label, .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .summary { margin: 16px 0 0; font-weight: 600; }
  .busiest { margin: 2px 0 0; color: var(--muted); }

  .day { margin-top: 22px; }
  .day h2 { margin: 0 0 8px; font-size: 1.15rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .busy-tag { padding: 1px 10px; font-size: .8rem; font-weight: 700; border-radius: 999px; background: #FFF1DC; color: var(--flag); border: 1px solid var(--flag); }
  .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .event {
    display: grid; grid-template-columns: 9.5rem 1fr; gap: 4px 14px;
    padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-left: 8px solid var(--c); border-radius: 12px;
  }
  @media (max-width: 560px) { .event { grid-template-columns: 1fr; } }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); }
  .event strong { display: block; }
  .meta { color: var(--muted); font-size: .95rem; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: var(--c); }
  .flag { display: block; margin-top: 4px; font-size: .9rem; font-weight: 600; color: var(--flag); }
  .flag.clash { color: var(--clash); }
  .empty { margin-top: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Calendar Explorer</h1>
  <p class="lede">Every calendar in one place. All events here are made up.</p>

  <div class="controls">
    <div class="search">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Concert, gym, board..." autocomplete="off">
    </div>
    <fieldset>
      <legend>Calendars</legend>
      <div class="filters" id="filters"></div>
    </fieldset>
    <label class="check"><input type="checkbox" id="overlaps-only"> Only show events that overlap</label>
  </div>

  <p class="summary" id="summary" aria-live="polite"></p>
  <p class="busiest" id="busiest"></p>
  <div id="days"></div>
</div>

<script>
/* ------------------------------------------------------------
   PART 2: HOW THE EXPLORER WORKS
   ------------------------------------------------------------ */

const $ = (id) => document.getElementById(id);

// Find events that overlap in time on the same day, and the ones in the same place
EVENTS.forEach((e) => { e.overlaps = []; e.samePlace = []; });
let overlapCount = 0;
let clashCount = 0;
for (let i = 0; i < EVENTS.length; i++) {
  for (let j = i + 1; j < EVENTS.length; j++) {
    const a = EVENTS[i];
    const b = EVENTS[j];
    if (a.date !== b.date || !a.start || !b.start) continue;
    if (a.start < b.end && b.start < a.end) {
      a.overlaps.push(b);
      b.overlaps.push(a);
      overlapCount++;
      if (a.place === b.place) {
        a.samePlace.push(b);
        b.samePlace.push(a);
        clashCount++;
      }
    }
  }
}

function time12(t) {
  let [h, m] = t.split(":").map(Number);
  const half = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + " " + half;
}

function when(e) {
  return e.start ? time12(e.start) + " – " + time12(e.end) : "All day";
}

function dayName(date) {
  return new Date(date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

// One checkbox per calendar
Object.entries(CALENDARS).forEach(([name, color]) => {
  const label = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = true;
  box.value = name;
  const swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.background = color;
  swatch.setAttribute("aria-hidden", "true");
  label.append(box, swatch, name);
  $("filters").append(label);
});

function show() {
  const term = $("search").value.trim().toLowerCase();
  const onCalendars = [...document.querySelectorAll("#filters input:checked")].map((box) => box.value);
  const overlapsOnly = $("overlaps-only").checked;

  const shown = EVENTS
    .filter((e) => onCalendars.includes(e.calendar))
    .filter((e) => !overlapsOnly || e.overlaps.length)
    .filter((e) => !term || (e.title + " " + e.place + " " + e.calendar).toLowerCase().includes(term))
    .sort((a, b) => (a.date + (a.start || "00:00")).localeCompare(b.date + (b.start || "00:00")));

  // Group by day
  const days = {};
  shown.forEach((e) => { (days[e.date] = days[e.date] || []).push(e); });

  $("days").replaceChildren(...Object.entries(days).map(([date, events]) => {
    const section = document.createElement("section");
    section.className = "day";
    const heading = document.createElement("h2");
    heading.textContent = dayName(date);
    const allThatDay = EVENTS.filter((e) => e.date === date).length;
    if (allThatDay >= BUSY_DAY) {
      const tag = document.createElement("span");
      tag.className = "busy-tag";
      tag.textContent = "Busy day: " + allThatDay + " events";
      heading.append(tag);
    }
    const list = document.createElement("ul");
    list.className = "events";
    events.forEach((e) => list.append(eventItem(e)));
    section.append(heading, list);
    return section;
  }));

  if (!shown.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nothing matches. Try another search or turn a calendar back on.";
    $("days").append(empty);
  }

  $("summary").textContent = "Showing " + shown.length + " of " + EVENTS.length + " events · " +
    overlapCount + " overlaps · " + clashCount + " same-place conflicts";
}

function eventItem(e) {
  const li = document.createElement("li");
  li.className = "event";
  li.style.setProperty("--c", CALENDARS[e.calendar] || "#888888");

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = when(e);

  const body = document.createElement("div");
  const title = document.createElement("strong");
  title.textContent = e.title;
  const meta = document.createElement("span");
  meta.className = "meta";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.setAttribute("aria-hidden", "true");
  meta.append(dot, e.calendar + " · " + e.place);
  body.append(title, meta);

  const others = e.overlaps.filter((o) => !e.samePlace.includes(o));
  if (e.samePlace.length) {
    const flag = document.createElement("span");
    flag.className = "flag clash";
    flag.textContent = "Same place, same time: " + e.samePlace.map((o) => o.title).join(", ");
    body.append(flag);
  }
  if (others.length) {
    const flag = document.createElement("span");
    flag.className = "flag";
    flag.textContent = "Overlaps with: " + others.map((o) => o.title + " (" + o.calendar + ")").join(", ");
    body.append(flag);
  }

  li.append(time, body);
  return li;
}

// The busiest day of the month
const counts = {};
EVENTS.forEach((e) => { counts[e.date] = (counts[e.date] || 0) + 1; });
const [busiestDate, busiestCount] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
$("busiest").textContent = "Busiest day: " + dayName(busiestDate) + ", with " + busiestCount + " events.";

$("search").addEventListener("input", show);
$("filters").addEventListener("change", show);
$("overlaps-only").addEventListener("change", show);

// Get started
$("title").textContent = TITLE;
show();
</script>
</body>
</html>
