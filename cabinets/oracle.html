<title>The Teacher's Lounge Oracle</title>
<script>
/* ------------------------------------------------------------
   PART 1: THE KNOBS. Change these to make the Oracle yours.
   ------------------------------------------------------------ */

const SPIN_SECONDS = 3;   // how long the orb spins before it speaks
const SOUND_ON = true;    // change to false to start with the sound off

// What the Oracle mutters while it thinks
const THINKING = [
  "Consulting the faculty handbook...",
  "Reading the coffee grounds in a lounge mug...",
  "Asking the copier. It will not answer...",
  "Searching the shared drive...",
  "Waiting for the Wi-Fi...",
  "Checking the sub calendar..."
];

// TOPICS: when your question uses one of these words, the Oracle answers on that topic.
// Plurals and endings count too: "copiers", "copies", and "copying" all mean "copy".
// If a question touches two topics, the one it mentions more (or last) wins.
// To add a topic, copy one block, change the words it listens for, and write new prophecies.
const TOPICS = [
  {
    listensFor: ["copier", "copies", "copy", "print", "printer", "laminator"],
    prophecies: [
      "The copier shall jam at the very moment of your greatest need. It was always thus.",
      "Tray 2 is empty. It has always been empty. It will always be empty.",
      "The copier works today, but only for people who don't need it.",
      "The laminator will be warm and waiting. This is a rare and holy sign."
    ]
  },
  {
    listensFor: ["kid", "kids", "student", "students", "homework", "class", "children"],
    prophecies: [
      "The kids are alright. The homework is in a backpack, under a banana.",
      "Three of them did the homework. One did it twice. One made a diorama nobody asked for.",
      "Your students learned more than they'll admit. They'll tell you in ten years.",
      "A student will ask, 'Is this graded?' The Oracle's answer is always yes."
    ]
  },
  {
    listensFor: ["snow", "weather", "cold", "winter", "recess", "rain", "storm"],
    prophecies: [
      "Snow shall fall before Halloween. Someone will say, 'Well, it's Minnesota.' They will be right.",
      "Indoor recess approaches. Gather your strength. And the good markers.",
      "The Oracle sees a snow day. The Oracle also sees an e-learning day. Brace yourself."
    ]
  },
  {
    listensFor: ["coffee", "caribou", "tea", "lunch", "lounge", "potluck", "food", "pizza", "hotdish", "snacks"],
    prophecies: [
      "The line at Caribou shall be long. Accept this. Good pizza awaits you later.",
      "The hotdish at the next potluck will contain tater tots. This is certain.",
      "Someone microwaved fish in the lounge. The Oracle knows who. The Oracle will never tell.",
      "A mug in the lounge sink has become self-aware. Approach it with kindness."
    ]
  },
  {
    listensFor: ["email", "emails", "parent", "parents", "meeting", "meetings", "principal", "boss"],
    prophecies: [
      "An email shall arrive at 9:58 PM. The Oracle advises: do not open it until morning.",
      "The meeting will run long. The snacks will run short.",
      "A parent will email just to say thank you. Print it. Keep it in a drawer for a hard day."
    ]
  },
  {
    listensFor: ["wifi", "wi-fi", "internet", "password", "computer", "laptop", "chromebook", "tech", "technology", "ai", "robots"],
    prophecies: [
      "Your password shall expire on the busiest day of the quarter. Every day is the busiest day.",
      "The Wi-Fi will drop during your best lesson of the year. They will remember the lesson anyway.",
      "Have you tried turning it off and on again? The Oracle has. It helped.",
      "The AI will write a beautiful paragraph. It will be about the wrong book.",
      "The AI can write the lesson. Only you know which kid needs the extra minute today."
    ]
  },
  {
    listensFor: ["sub", "subs", "substitute", "sick", "absent"],
    prophecies: [
      "Your sub plans will be three pages long. The sub will read one. It will be fine.",
      "The sub will leave a note that says 'They were great!' Do not ask follow-up questions."
    ]
  },
  {
    listensFor: ["friday", "weekend", "break", "vacation", "summer", "holiday"],
    prophecies: [
      "Friday is coming. The Oracle can feel it in its glass.",
      "This Friday? Glorious. Something will break on purpose, and everyone will cheer.",
      "You will spend the first day of break doing laundry. The second day will be glorious.",
      "Winter break is closer than it looks. Not much closer. But closer."
    ]
  },
  {
    listensFor: ["grade", "grades", "grading", "test", "tests", "quiz", "quizzes", "assessment", "rubric"],
    prophecies: [
      "The stack of grading will shrink. Then it will grow back, like a hydra.",
      "The test will measure something. Whether it's the thing that matters, even the Oracle wonders.",
      "Somewhere, a rubric is being revised. It will be revised again."
    ]
  }
];

// EITHER/OR: "Pizza or hotdish?" The Oracle picks a side. {choice} becomes the side it picked.
const EITHER_OR = [
  "{choice}. The Oracle has spoken.",
  "{choice}. Do not ask the Oracle to explain.",
  "{choice}, obviously. The copier agrees.",
  "{choice}. But bring snacks either way."
];

// QUESTION KINDS: if no topic matches, the Oracle answers the kind of question you asked,
// judging by the first few words.
const QUESTION_KINDS = [
  {
    firstWords: ["will", "is", "are", "am", "can", "could", "should", "would", "do", "does", "did", "has", "have", "may", "might", "shall"],
    answers: [
      "The signs say yes. The copier says no. Trust the signs.",
      "Yes. But only after a fire drill.",
      "The mists are cloudy. Ask again after coffee.",

      "No. But something better is on its way.",
      "The Oracle nods slowly. That means yes."
    ]
  },
  {
    firstWords: ["when"],
    answers: [
      "Right after the next fire drill.",
      "Thursday. It's always Thursday.",
      "Sooner than the next snow day. Later than you'd like."
    ]
  },
  {
    firstWords: ["who"],
    answers: [
      "The one holding the good stapler.",
      "Someone in the lounge. They know what they did.",
      "You. It was always you."
    ]
  },
  {
    firstWords: ["why"],
    answers: [
      "Because the copier willed it.",
      "The Oracle has wondered the same thing since 1997. Still no answer.",
      "For the same reason the laminator is always warm: mystery."
    ]
  },
  {
    firstWords: ["how"],
    answers: [
      "Slowly, then all at once.",
      "With a lot of sticky notes.",
      "The same way you do everything: better than you think."

  },
  {
    firstWords: ["where"],
    answers: [
      "In the shared drive, in a folder called 'New Folder (7).'",
      "In the staff fridge, next to someone's yogurt.",
      "Exactly where you left it, which is the last place you'll look."
    ]
  },

    firstWords: ["what", "which"],
    answers: [
      "The answer is in the faculty handbook, page 47. There is no page 47.",
      "The thing you already suspected. Trust your gut.",
      "Whatever it is, it's probably in the shared drive."
    ]
  }

// MANNERS: a greeting or a thank-you of three words or fewer gets manners back, not a prophecy.
const MANNERS = [
  { firstWords: ["hello", "hi", "hey", "greetings", "howdy"], answers: ["Hello, seeker. Ask, and the Oracle shall answer. Eventually.", "Greetings. The Oracle has been expecting you since third period."] },
  { firstWords: ["thanks", "thank", "ty"], answers: ["You are welcome. Tip your copier.", "The Oracle accepts thanks, coffee, and the good markers."] },
  { firstWords: ["bye", "goodbye", "farewell"], answers: ["Go in peace. Check your mailbox on the way out.", "Farewell. The Oracle will be here, humming, next to the laminator."] }

// AGAIN: for the same question twice in a row. {last} becomes what the Oracle said the first time.
const AGAIN = [
  "You asked that already. The Oracle's answer stands: {last}",
  "The Oracle heard you the first time. {last}",
  "Asking twice does not stir the mists. {last}"
];

// SILENCE: for an empty question.
const SILENCE = [

  "The Oracle hears nothing, and nods. Try again with words."
];

const PROPHECIES = [

  "A fire drill shall arrive at the exact moment everyone is finally focused.",

  "The copier shall jam at the very moment of your greatest need. It was always thus.",
  "Indoor recess approaches. Gather your strength. And the good markers.",

<style>
  /* Colors: change these to make it yours */
  :root {
    --night: #0A1A33;   /* the background: a Minnesota night */
    --navy: #10345A;    /* the glow at the top of the sky */
    --glow: #8F6CFF;    /* the light inside the orb */
    --gold: #E6B84F;    /* the tripod, the button, and the prophecy */
    --sky: #66C1E7;     /* the sparkles and the mutterings */
    --text: #EAF6FC;    /* everything else */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    background:
      radial-gradient(2px 2px at 20% 30%, #ffffff88, transparent),
      radial-gradient(2px 2px at 72% 18%, #ffffff66, transparent),
      radial-gradient(1.5px 1.5px at 40% 82%, #ffffff77, transparent),
      radial-gradient(1.5px 1.5px at 86% 64%, #ffffff55, transparent),
      radial-gradient(ellipse at top, var(--navy), var(--night) 70%);
  }

  main { width: 100%; max-width: 34rem; text-align: center; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 0 0 4px; }
  .tagline { margin: 0; font-style: italic; opacity: .85; }

  /* The crystal ball on its tripod. The drawing is in the <svg> below; this is how it moves. */
  .orb {
    display: block;
    height: clamp(170px, 36vh, 330px);
    margin: 10px auto 2px;
    overflow: visible;
  }
  .mn { fill: #163F73; stroke: var(--sky); stroke-opacity: .35; stroke-width: .6; }   /* the state */
  .sparkles use, .teal { fill: var(--sky); }
  .white { fill: #FFFFFF; }
  .ball { filter: drop-shadow(0 0 14px #8F6CFF88); transition: filter .6s; }
  .glow, .swirl, .logo { transform-box: view-box; transform-origin: 120px 112px; }

  /* The orb only swirls while it thinks */
  .orb.thinking .ball { filter: drop-shadow(0 0 34px #8F6CFFEE); }
  .orb.thinking .glow { animation: breathe 1.1s ease-in-out infinite alternate; }
  .orb.thinking .swirl { animation: swirl 1.6s linear infinite; }
  .orb.thinking .logo { animation: drift 2.4s ease-in-out infinite alternate; }
  .orb.thinking .sparkles use { animation: twinkle .9s ease-in-out infinite alternate; }
  .orb.thinking .sparkles use:nth-child(3n) { animation-delay: -.3s; }
  .orb.thinking .sparkles use:nth-child(3n+1) { animation-delay: -.6s; }

  @keyframes swirl   { to { transform: rotate(360deg); } }
  @keyframes breathe { from { opacity: .4; transform: scale(.9); } to { opacity: .95; transform: scale(1.1); } }
  @keyframes drift   { from { transform: rotate(-4deg) scale(.98); } to { transform: rotate(4deg) scale(1.03); } }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

  .status { min-height: 1.5em; margin: 0; font-style: italic; color: var(--sky); }

  form { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  label { width: 100%; }
  input {
    flex: 1 1 16rem;
    padding: 12px 16px;
    font: inherit;
    border: 2px solid #E6B84FB3;
    border-radius: 999px;
    background: #FFFFFF14;
    color: var(--text);
  }
  input::placeholder { color: #EAF6FCAA; }
  button {
    padding: 12px 22px;
    font: inherit;
    font-weight: bold;
    border: none;
    border-radius: 999px;
    background: var(--gold);
    color: #2A1A00;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* The sound switch, top right */
  .sound {
    position: fixed; top: 12px; right: 12px;
    padding: 6px 14px;
    font-size: .9rem;
    background: transparent;
    color: var(--text);
    border: 2px solid #E6B84FB3;
  }
  .sound[aria-pressed="false"] { opacity: .75; text-decoration: line-through; }

  .asked { min-height: 1.4em; margin: 0; font-style: italic; opacity: .8; }
  .prophecy {
    min-height: 2.9em;
    margin: 6px 0 20px;
    font-size: 1.3rem;
    line-height: 1.45;
    color: var(--gold);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .8s, transform .8s;
  }
  .prophecy.revealed { opacity: 1; transform: none; }

  /* Wide, short screens (a shared tab, a laptop): the orb sits beside the words */
  @media (min-aspect-ratio: 4/3) and (max-height: 640px) {
    body { padding: 12px 16px; }
    main { max-width: 46rem; display: grid; grid-template-columns: auto 1fr; gap: 0 28px; align-items: center; text-align: left; }
    .orb { grid-column: 1; grid-row: 1 / span 6; height: min(82vh, 330px); margin: 0; }
    main > :not(.orb) { grid-column: 2; }
    form { justify-content: flex-start; }
  }

  /* Short, narrow screens: shrink the orb so the prophecy stays in view */
  @media (max-aspect-ratio: 4/3) and (max-height: 640px) {
    body { padding-top: 12px; padding-bottom: 12px; }
    h1 { font-size: 1.5rem; }
    .orb { height: 140px; margin: 6px auto 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb.thinking .glow, .orb.thinking .swirl, .orb.thinking .logo, .orb.thinking .sparkles use { animation: none; }
    .ball { transition: none; }
    .prophecy { transition: none; }
  }
</style>
</head>

    <path d="M166,152A62,62 0 0 0 178,100" fill="none" stroke="#66C1E7" stroke-width="2.5" opacity=".45" stroke-linecap="round" filter="url(#haze)"/>

    <!-- The front of the rings, over the orb -->
    <g transform="rotate(-12 120 118)" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
      <path d="M20,118A100,30 0 0 0 220,118"/>
    </g>
    <path d="M78,180A42,12 0 0 0 162,180" fill="none" stroke="url(#gold)" stroke-width="5"/>
  </svg>

  <p class="status" id="status"></p>
  <p class="asked" id="asked"></p>
  <p class="prophecy" id="prophecy" aria-live="polite"></p>

  <form id="ask">
    <label for="question">What do you wish to know?</label>
    <input id="question" placeholder="Will the copier work today?" autocomplete="off">
    <button id="go" type="submit">Consult the Oracle</button>
  </form>
</main>

<script>
/* ------------------------------------------------------------
   PART 2: SOUND EFFECTS. Made from math, so no sound files.
   ------------------------------------------------------------ */

let audio; // the browser's sound engine, started on the first click

function tone(pitch, startIn, seconds, volume) {
  const start = audio.currentTime + startIn;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.value = pitch;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
  osc.connect(gain).connect(audio.destination);
  osc.start(start);
  osc.stop(start + seconds);
}

function shimmer() { // sparkly notes while the orb spins
  for (let i = 0; i < SPIN_SECONDS * 6; i++) {
    tone(900 + Math.random() * 1100, i / 6, 0.25, 0.04);
  }
}

function gong() { // a big BONG when the prophecy arrives
  tone(98, 0, 4, 0.35);
  tone(147, 0, 3, 0.15);
  tone(271, 0, 2.5, 0.1);
  tone(529, 0, 1.5, 0.06);
}


/* ------------------------------------------------------------
   PART 3: HOW THE ORACLE READS A QUESTION
   ------------------------------------------------------------ */

// Picks from a list, saying everything once before anything repeats, and never the same thing twice running
const bags = new WeakMap();
function pick(list) {
  let bag = bags.get(list);
  if (!bag || bag.length === 0) {
    const previous = bag && bag.previous;
    bag = list.slice().sort(() => Math.random() - 0.5);
    if (bag.length > 1 && bag[bag.length - 1] === previous) bag.unshift(bag.pop());
    bags.set(list, bag);
  }
  bag.previous = bag.pop();
  return bag.previous;
}

// The words in a question, lowercased: "Will the copier work?" becomes ["will", "the", "copier", "work"]
function wordsOf(text) {
  return text.toLowerCase().match(/[a-z'-]+/g) || [];
}

// Trims a word to its root, so "copiers", "copies", and "copying" all count as "copy"
function root(word) {
  let w = word.replace(/ie[sd]$/, "y");
  if (w.length > 3 && !w.endsWith("ss")) w = w.replace(/e?s$/, "");
  if (w.length > 5) w = w.replace(/(ing|ed)$/, "");
  return w.replace(/e+$/, "");
}

// Which topic does the question touch? The one with the most words in it; in a tie, the one mentioned last.
function topicOf(words) {
  const roots = words.map(root);
  let best = null;
  for (const topic of TOPICS) {
    const listened = topic.listensFor.map(root);
    const hits = roots.map((r, i) => (listened.includes(r) ? i : -1)).filter((i) => i >= 0);
    if (hits.length === 0) continue;
    const last = hits[hits.length - 1];
    if (!best || hits.length > best.count || (hits.length === best.count && last > best.last)) {
      best = { topic, count: hits.length, last };
    }
  }
  return best && best.topic;
}

// "Pizza or hotdish?" gives ["Pizza", "hotdish"]. No "or" (or "or not") gives nothing.
// "Will it snow or will it rain?" is two whole clauses, so it gives ["snow", "rain"].
function choicesIn(text) {
  const sides = text.trim().replace(/[?!.]+$/, "").split(/\s+or\s+/i).map((side) => side.trim());
  if (sides.length < 2 || sides.some((side) => !side)) return null;
  const last = sides.pop();
  if (/^not\b/i.test(last)) return null;
  const opener = /^(will|would|should|shall|can|could|do|does|did|is|are|am|may|might)\s+((i|we|it|they|you|he|she)\b\s*)?/i;
  const choices = opener.test(last)
    ? sides.concat(last).map((side) => side.replace(opener, ""))
    : sides.map((side) => side.split(/\s+/).pop().replace(/[,;:]+$/, "")).concat(last);
  return choices.every(Boolean) ? choices : null;
}

// The Oracle reads your question and decides how to answer
function answer(questionText) {
  const words = wordsOf(questionText);

  // 1. Nothing? Silence gets an answer too.
  if (words.length === 0) return pick(SILENCE);

  // 2. A short hello or thank-you gets manners.
  if (words.length <= 3) {
    const manner = MANNERS.find((m) => m.firstWords.includes(words[0]));
    if (manner) return pick(manner.answers);
  }

  // 3. Either/or? The Oracle picks a side.
  const choices = choicesIn(questionText);
  if (choices) {
    const choice = choices[Math.floor(Math.random() * choices.length)];
    return pick(EITHER_OR).replace("{choice}", choice.charAt(0).toUpperCase() + choice.slice(1));
  }

  // 4. Does the question touch one of the TOPICS?
  const topic = topicOf(words);
  if (topic) return pick(topic.prophecies);

  // 5. What kind of question is it? (Reads the first three words, in order.)
  for (const word of words.slice(0, 3)) {
    const kind = QUESTION_KINDS.find((k) => k.firstWords.includes(word));
    if (kind) return pick(kind.answers);
  }

  // 6. None of those? A classic prophecy.
  return pick(PROPHECIES);
}


/* ------------------------------------------------------------
   PART 4: WHAT HAPPENS WHEN YOU ASK
   ------------------------------------------------------------ */

const orb = document.getElementById("orb");
const statusLine = document.getElementById("status");
const askedLine = document.getElementById("asked");
const prophecyLine = document.getElementById("prophecy");
const question = document.getElementById("question");
const button = document.getElementById("go");
let memory = { question: "", prophecy: "" };   // the last question, and what the Oracle said to it

// The sound switch in the corner
let soundOn = SOUND_ON;
const soundSwitch = document.getElementById("sound");
function showSound() {
  soundSwitch.setAttribute("aria-pressed", String(soundOn));
  soundSwitch.firstElementChild.textContent = soundOn ? "🔊" : "🔇";
}
showSound();
soundSwitch.addEventListener("click", () => { soundOn = !soundOn; showSound(); });

document.getElementById("ask").addEventListener("submit", (event) => {
  event.preventDefault();
  button.disabled = true;
  prophecyLine.classList.remove("revealed");
  askedLine.textContent = question.value ? `You asked: "${question.value}"` : "";
  orb.classList.add("thinking");

  if (soundOn) {
    audio = audio || new AudioContext();
    shimmer();
  }

  // Mutter something new every 0.7 seconds while thinking
  statusLine.textContent = pick(THINKING);
  const mutter = setInterval(() => { statusLine.textContent = pick(THINKING); }, 700);

  setTimeout(() => {
    clearInterval(mutter);
    orb.classList.remove("thinking");
    statusLine.textContent = "";

    // The same question twice in a row? The Oracle remembers.
    const asked = wordsOf(question.value).join(" ");
    let prophecy;
    if (asked && asked === memory.question) {
      prophecy = pick(AGAIN).replace("{last}", memory.prophecy);
    } else {
      prophecy = answer(question.value);
      memory = { question: asked, prophecy };
    }

    prophecyLine.textContent = prophecy;
    prophecyLine.classList.add("revealed");
    prophecyLine.scrollIntoView({ block: "nearest" });
    if (soundOn) gong();
    button.disabled = false;
  }, SPIN_SECONDS * 1000);
});
</script>
</body>
</html>
